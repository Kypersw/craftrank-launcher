# Builds the Windows launcher on GitHub and publishes it as a release.
#
# Raise "version" in package.json and push to main: if there is no release for that version yet,
# this builds it and publishes release v<version> with CraftRank-Launcher.exe (portable),
# CraftRank-Launcher-Setup.exe (installer) and SHA256SUMS.txt.
# Pushing a tag like v1.3.4 or publishing a release on GitHub works too.
name: Build launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-launcher
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            npm version "$v" --no-git-tag-version --allow-same-version
          else
            v=$(node -p "require('./package.json').version")
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          # on a plain push to main, only build when this version has no release yet
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/* ]] && gh release view "v$v" >/dev/null 2>&1; then
            echo "build=no" >> "$GITHUB_OUTPUT"; echo "v$v is already released, nothing to do."
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Update release notes
        # release-notes.md is the newest version's notes; notes/v<version>.md fixes the notes of older releases
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail="Download CraftRank-Launcher.exe (no install needed) or CraftRank-Launcher-Setup.exe (installer). More on https://craftrank.org/launcher"
          upd() { gh release view "$1" >/dev/null 2>&1 || return 0; body="$(cat "$2")"$'\n\n'"$tail"; [ "$(gh release view "$1" --json body -q .body)" == "$body" ] || gh release edit "$1" --notes "$body"; }
          [ -s release-notes.md ] && upd "${{ steps.ver.outputs.tag }}" release-notes.md
          for f in notes/v*.md; do [ -s "$f" ] && upd "$(basename "$f" .md)" "$f"; done
          true

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.build == 'yes'
        with:
          node-version: 20
          cache: npm

      - if: steps.ver.outputs.build == 'yes'
        run: npm ci

      - name: Build portable and installer
        if: steps.ver.outputs.build == 'yes'
        run: npx electron-builder --win portable nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Name the files
        if: steps.ver.outputs.build == 'yes'
        shell: bash
        run: |
          cd dist
          v="${{ steps.ver.outputs.version }}"
          cp "CraftRank-Launcher-$v.exe" CraftRank-Launcher.exe
          cp "CraftRank-Launcher-Setup-$v.exe" CraftRank-Launcher-Setup.exe
          sha256sum CraftRank-Launcher.exe CraftRank-Launcher-Setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        if: steps.ver.outputs.build == 'yes' && github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t="${{ steps.ver.outputs.tag }}"
          notes="Download CraftRank-Launcher.exe (no install needed) or CraftRank-Launcher-Setup.exe (installer). More on https://craftrank.org/launcher"
          # release-notes.md (one short paragraph) is shown as "Last update" in the launcher
          if [ -s release-notes.md ]; then notes="$(cat release-notes.md)"$'\n\n'"$notes"; fi
          gh release view "$t" >/dev/null 2>&1 || gh release create "$t" --target "$GITHUB_SHA" --title "CraftRank Launcher ${t#v}" --notes "$notes"
          gh release upload "$t" dist/CraftRank-Launcher.exe dist/CraftRank-Launcher-Setup.exe dist/SHA256SUMS.txt --clobber

      - name: Keep the files (manual runs)
        if: steps.ver.outputs.build == 'yes' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: craftrank-launcher
          path: |
            dist/CraftRank-Launcher.exe
            dist/CraftRank-Launcher-Setup.exe
            dist/SHA256SUMS.txt
